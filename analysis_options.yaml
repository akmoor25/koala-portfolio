# Dart の静的解析（エラー・警告・lint）の設定。
# 結果は IDE に表示されるほか、`flutter analyze` でも確認できる。
# Effective Dart に準拠する: https://dart.dev/effective-dart
# 参考: https://dart.dev/tools/analysis

# Flutter 推奨の lint セットを有効にする。
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - node_modules/**
    # FlutterFire CLI の生成物（再生成で上書きされるため、解析と整形の対象外にする）。
    - lib/firebase_options.dart
    # gen_l10n の生成物（ARB から再生成される）
    - lib/l10n/app_localizations*.dart

# Effective Dart の既定に合わせ、1 行は 80 桁とする。
formatter:
  page_width: 80

linter:
  # 上記セットに対するルールの追加・無効化はここで行う。
  # 特定の行やファイルだけ抑制する場合は `// ignore:` / `// ignore_for_file:` を使う（理由を添える）。
  # ルール一覧: https://dart.dev/tools/linter-rules
  rules:
    # Style
    - directives_ordering
    - prefer_relative_imports
    - omit_local_variable_types
    - prefer_final_locals
    - prefer_const_constructors
    # Usage
    - always_declare_return_types
    - avoid_void_async
    - avoid_dynamic_calls
    - avoid_catches_without_on_clauses
    - discarded_futures
    - unawaited_futures
    # Design
    - type_annotate_public_apis
    - avoid_classes_with_only_static_members
