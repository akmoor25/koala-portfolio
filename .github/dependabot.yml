version: 2
# 更新の確認ごとに CI が動くため、種類ごとに 1 つの PR にまとめ、週 1 回にする。
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  # Cloud Functions（firebase-admin、firebase-functions など）。
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    groups:
      functions:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      pub:
        patterns: ["*"]
