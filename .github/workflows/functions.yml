# Cloud Functions（通知の送信と、毎日の掃除）の型の検査とテスト。functions/ とルールの変更のときだけ動かす（無料枠の節約）。
# テストは、Realtime Database の Emulator を使う。FCM への送信は、テストの中で差し替える。
name: Functions tests

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "database.rules.json"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/functions.yml"
  pull_request:
    branches: [main]
    paths:
      - "functions/**"
      - "database.rules.json"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/functions.yml"

permissions:
  contents: read

concurrency:
  group: functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # Firebase Emulator は Java 21 以上が必要
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      - run: npm --prefix functions ci

      # 型の検査（tsc）と、判定・送信内容・二重防止・連打の抑制などのテスト。
      - run: npm run test:functions
