# 端末（画面サイズ・API・向き・文字サイズ）ごとに、同じ画面を開いてスクリーンショットを集める。
# 集めた画像は 1 つの HTML（ギャラリー）にまとめ、人の目で確かめる。
#
# 実行方法：タグ `devices-*` を push する（例：`git tag devices-1 && git push origin devices-1`）。
#   Actions 画面の「Run workflow」から、`main` を選んで手動で実行することもできる。
name: Device matrix

on:
  push:
    tags: ["devices-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # テスト用の APK を 1 回だけ作り、各端末で使い回す（端末ごとにビルドしない）。
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # Gradle の依存とラッパーのキャッシュ。保存するのは既定ブランチ（main）の実行だけで、
      # タグの実行は、それを読む（android-build.yml が保存する）。
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          add-job-summary: never

      - run: flutter pub get

      # 日本語の画面を撮る APK と、英語の画面を撮る APK（言語は、ビルド時の定義で決める）。
      - name: Build the app that runs the integration test (Japanese)
        run: |
          flutter build apk --debug --flavor development --target-platform android-x64 --target=integration_test/screens_test.dart
          mkdir -p apks
          cp build/app/outputs/flutter-apk/app-development-debug.apk apks/ja.apk

      - name: Build the app that runs the integration test (English)
        run: |
          flutter build apk --debug --flavor development --target-platform android-x64 --target=integration_test/screens_test.dart --dart-define=SCREENSHOT_LOCALE=en
          cp build/app/outputs/flutter-apk/app-development-debug.apk apks/en.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-apk
          path: apks/
          if-no-files-found: error
          retention-days: 3

  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # 小型：480×800、最低の API（minSdk 29）
          - name: small-480x800-api29
            api: 29
            profile: Nexus One
          # 標準：1080×2400
          - name: standard-1080x2400-api34
            api: 34
            profile: pixel_6
          # 大型：1440×3120、新しい API
          - name: large-1440x3120-api35
            api: 35
            profile: pixel_6_pro
          # タブレットの横向き
          - name: tablet-landscape-api34
            api: 34
            profile: pixel_c
            rotate: "1"
          # 標準＋文字サイズ最大
          - name: standard-font-2.0-api34
            api: 34
            profile: pixel_6
            font_scale: "2.0"
          # 英語（文が長く、崩れやすい）：小型と、タブレットの横向き。全端末にすると分数が倍になるため絞る。
          - name: small-480x800-api29-en
            api: 29
            profile: Nexus One
            locale: en
          - name: tablet-landscape-api34-en
            api: 34
            profile: pixel_c
            rotate: "1"
            locale: en
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integration-apk
          path: apk

      - run: flutter pub get

      # エミュレータのディスク（約 7 GB）が足りなくなるため、使わない大きなものを消す。
      # （hostedtoolcache には Flutter が入っているので消さない。）
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/lib/android/sdk/ndk /usr/local/share/powershell /opt/microsoft
          df -h / | tail -1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APK: apk/${{ matrix.locale || 'ja' }}.apk
          OUT: out
          ROTATE: ${{ matrix.rotate }}
          FONT_SCALE: ${{ matrix.font_scale }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash tool/ci/run_device.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: device-${{ matrix.name }}
          path: out/
          if-no-files-found: ignore
          retention-days: 30

  # 端末ごとの画像を、見比べやすい 1 つの HTML にまとめる。
  gallery:
    needs: device
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: device-*
          path: devices

      # device-<名前>/ を <名前>/ にして、ギャラリーの列の見出しにする。
      - name: Make the gallery
        run: |
          shopt -s nullglob
          dirs=(devices/device-*)
          [ ${#dirs[@]} -gt 0 ] || { echo "::error::端末の成果物がありません"; exit 1; }
          for d in "${dirs[@]}"; do mv "$d" "devices/${d#devices/device-}"; done
          python3 tool/ci/make_gallery.py devices gallery

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-gallery
          path: gallery/
          retention-days: 90
