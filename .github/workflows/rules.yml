# Firebase のセキュリティルールのテスト。ルールとそのテストに関係する変更のときだけ動かす（無料枠の節約）。
name: Rules tests

on:
  push:
    branches: [main]
    paths:
      - "database.rules.json"
      - "test/rules.test.js"
      - "package.json"
      - "package-lock.json"
      - "firebase.json"
      - ".github/workflows/rules.yml"
  pull_request:
    branches: [main]
    paths:
      - "database.rules.json"
      - "test/rules.test.js"
      - "package.json"
      - "package-lock.json"
      - "firebase.json"
      - ".github/workflows/rules.yml"

permissions:
  contents: read

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      # Firebase Emulator は Java 21 以上が必要
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      - run: npm run test:rules
