# Android の debug APK を、署名鍵なしでビルドできること。Gradle の設定や依存、ネイティブのコードに
# 関係する変更のときだけ動かす（約 6 分。実行時間の節約）。Dart のコードの変更は ci.yml の解析とテストで見る。
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/firebase_options.dart"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/firebase_options.dart"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # Gradle の依存とラッパーのキャッシュ。保存するのは既定ブランチ（main）の実行だけで、
      # タグの実行は、それを読む（android-build.yml が保存する）。
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          add-job-summary: never

      - run: flutter pub get

      # 署名鍵なしでビルドできること（key.properties は存在しない）。
      # 時間の節約のため x86_64 だけ（全 ABI のビルドは build-apk.yml で行う）。
      - name: Build debug APK
        run: flutter build apk --debug --flavor development --target-platform android-x64
