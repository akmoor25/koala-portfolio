# 秘密情報の検査と、文書のリンクの検査。軽い（約 1 分）ので、すべての push で動かす。
# 整形、解析、テストは ci.yml が、関係する変更のときだけ動かす（無料枠の節約）。
name: Light checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: light-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-and-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 履歴の全体を検査する。
          fetch-depth: 0

      # 履歴の全体を検査する（gitleaks-action は push のたびに直近のコミットしか見ないため、CLI を直接使う）。
      # 設定は .gitleaks.toml（Firebase のクライアント用キーだけを例外にしている）。
      - name: Scan the whole history
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose

      # README と doc/ のリンクと画像、doc/legal/ の 4 つの HTML のリンクが、実在すること（コードの移動や名前の変更でも壊れるため、毎回行う）。
      # doc/legal/ は、公開する文書として守る中身（日英の見出しの数、外部の資源を使わない、冒頭の断りなど）も検査する。
      - name: Check the document links
        run: python3 tool/ci/check_doc_links.py
