org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
android.useAndroidX=true
android.enableJetifier=true
# builtInKotlin フラグは Flutter のマイグレーターが自動で追加したもの
android.builtInKotlin=false
# newDsl フラグは Flutter のマイグレーターが自動で追加したもの
android.newDsl=false
# Kotlin 2.3 の増分コンパイルが、Windows で「Could not close incremental caches」により失敗したため無効にする
# （プラグインのソースが C:、ビルドの出力先が G: と別ドライブだったことが原因と推定。Kotlin のコードは少なく影響は小さい）。
kotlin.incremental=false
